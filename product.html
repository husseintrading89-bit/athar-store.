<html lang="ar" dir="rtl">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المنتج | أثر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Amiri:wght@700&family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================
   ATHAR / أثر — luxury editorial theme
   ============================================ */
:root {
  --bg: #FBF9F5;
  --card: #FFFFFF;
  --sand: #F2ECE4;
  --ink: #2A2827;
  --ink-soft: #6b6156;
  --line: #E5DEC3;
  --accent: #8C6239;
  --accent-soft: #A67C52;
  --white: #FFFFFF;

  --font-display: 'Playfair Display', 'Amiri', serif;
  --font-nav: 'Montserrat', 'Tajawal', sans-serif;
  --font-body: 'Inter', 'Tajawal', sans-serif;
  --radius: 2px;
  --gap: 24px;
  --maxw: 1280px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, input, select { font-family: var(--font-body); font-size: 1rem; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 32px; }

a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ============================================
   Header
   ============================================ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 0;
  gap: 16px;
}

.logo {
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  white-space: nowrap;
  color: var(--ink);
}
.logo .dot { color: var(--accent); }

.main-nav {
  display: flex;
  gap: 30px;
  font-family: var(--font-nav);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.main-nav a { padding-bottom: 4px; border-bottom: 1px solid transparent; }
.main-nav a:hover, .main-nav a.active { border-color: var(--accent); color: var(--accent); }

.header-actions { display: flex; align-items: center; gap: 16px; }

.lang-btn {
  background: transparent;
  border: 1px solid var(--ink);
  color: var(--ink);
  padding: 6px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.78rem;
  font-family: var(--font-nav);
  letter-spacing: 0.1em;
}
.lang-btn:hover { background: var(--ink); color: var(--white); }

.cart-btn {
  position: relative;
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--ink);
  padding: 9px 18px;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.78rem;
  font-family: var(--font-nav);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.cart-btn:hover { background: var(--ink); color: var(--white); }
.cart-count {
  position: absolute;
  top: -8px;
  inset-inline-end: -8px;
  background: var(--accent);
  color: var(--white);
  font-size: 0.68rem;
  min-width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

.nav-toggle {
  display: none;
  background: none;
  border: none;
  font-size: 1.4rem;
  cursor: pointer;
  color: var(--ink);
}

@media (max-width: 780px) {
  .main-nav { display: none; }
  .nav-toggle { display: block; }
  .main-nav.open {
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 100%;
    inset-inline: 0;
    background: var(--bg);
    padding: 16px 32px 24px;
    border-bottom: 1px solid var(--line);
    gap: 18px;
  }
}

/* ============================================
   Hero — widescreen editorial banner with
   a centered floating headline box
   ============================================ */
.hero {
  position: relative;
}
.hero-media {
  width: 100%;
  aspect-ratio: 16/8;
  overflow: hidden;
  background: var(--sand);
}
.hero-media img { width: 100%; height: 100%; object-fit: cover; }

.hero-floating {
  position: relative;
  margin: -70px auto 0;
  max-width: 780px;
  background: rgba(255,255,255,0.96);
  padding: 44px 48px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(42,40,39,.12);
}

.hero-kicker {
  color: var(--accent);
  font-family: var(--font-nav);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(1.6rem, 3.4vw, 2.4rem);
  font-weight: 700;
  line-height: 1.3;
  margin: 0 0 16px;
}
.hero-desc {
  font-size: 1rem;
  color: var(--ink-soft);
  margin: 0 0 26px;
}

@media (max-width: 780px) {
  .hero-media { aspect-ratio: 3/4; }
  .hero-floating { margin-top: -50px; padding: 32px 24px; width: calc(100% - 32px); }
}

/* ============================================
   Buttons
   ============================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 30px;
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-family: var(--font-nav);
  cursor: pointer;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--white);
  width: fit-content;
  transition: background .2s ease, color .2s ease;
}
.btn:hover { background: transparent; color: var(--ink); }

.btn-outline { background: transparent; color: var(--ink); }
.btn-outline:hover { background: var(--ink); color: var(--white); }

.btn-block { width: 100%; justify-content: center; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:disabled:hover { background: var(--ink); color: var(--white); }

/* ============================================
   Section headings
   ============================================ */
.section { padding: 76px 0; }
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 40px;
  gap: 16px;
  flex-wrap: wrap;
}
.section-title {
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 700;
  margin: 0;
}
.section-link {
  font-family: var(--font-nav);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--ink);
}

/* ============================================
   Category grid — 3 columns
   ============================================ */
.cat-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--gap);
}
.cat-card {
  position: relative;
  aspect-ratio: 3/4;
  overflow: hidden;
  background: var(--sand);
  display: block;
}
.cat-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.cat-card:hover img { transform: scale(1.04); }
.cat-label-wrap {
  position: absolute;
  bottom: 0; inset-inline: 0;
  padding: 24px 20px;
  background: linear-gradient(transparent, rgba(0,0,0,.55));
  color: var(--white);
}
.cat-label {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.25rem;
  margin-bottom: 4px;
}
.cat-desc { font-size: 0.8rem; opacity: 0.9; }

@media (max-width: 860px) { .cat-strip { grid-template-columns: 1fr; } }

/* ============================================
   Product grid & cards
   ============================================ */
.product-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px 24px;
}
@media (max-width: 980px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 700px) { .product-grid { grid-template-columns: repeat(2, 1fr); gap: 28px 16px; } }

.product-card { display: block; }
.product-media {
  position: relative;
  aspect-ratio: 4/5;
  overflow: hidden;
  background: var(--sand);
  margin-bottom: 16px;
}
.product-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.product-card:hover .product-media img { transform: scale(1.035); }

.product-tag {
  position: absolute;
  top: 12px;
  inset-inline-start: 12px;
  background: var(--card);
  color: var(--accent);
  font-family: var(--font-nav);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 5px 10px;
  border-radius: var(--radius);
}
.product-cat {
  font-family: var(--font-nav);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-soft);
  margin-bottom: 6px;
}
.product-name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 0 0 6px; }
.product-price { color: var(--ink-soft); font-size: 0.92rem; }
.price-compare { text-decoration: line-through; opacity: 0.6; margin-inline-end: 8px; }
.price-now { color: var(--accent); font-weight: 700; }
.gift-badge {
  margin-top: 8px;
  display: inline-block;
  font-family: var(--font-nav);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--line);
  padding: 4px 9px;
  border-radius: var(--radius);
}

/* Filters */
.filter-row { display: flex; gap: 10px; margin-bottom: 36px; flex-wrap: wrap; }
.filter-chip {
  padding: 9px 18px;
  border: 1px solid var(--ink);
  border-radius: 20px;
  font-family: var(--font-nav);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  background: transparent;
}
.filter-chip.active { background: var(--ink); color: var(--white); }

/* ============================================
   Product detail
   ============================================ */
.product-detail {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  padding: 60px 0 84px;
}
@media (max-width: 860px) { .product-detail { grid-template-columns: 1fr; gap: 28px; } }

.pd-media { background: var(--sand); aspect-ratio: 4/5; overflow: hidden; }
.pd-media img { width: 100%; height: 100%; object-fit: cover; }

.pd-info .breadcrumb {
  font-family: var(--font-nav);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 20px;
}
.pd-info h1 { font-family: var(--font-display); font-size: 2rem; margin: 0 0 12px; font-weight: 700; }
.pd-price { font-size: 1.25rem; font-weight: 700; margin-bottom: 24px; color: var(--accent); }
.pd-desc { color: var(--ink-soft); margin-bottom: 30px; max-width: 48ch; }

.option-group { margin-bottom: 26px; }
.option-label {
  font-family: var(--font-nav);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: block;
  color: var(--ink-soft);
}

.swatches { display: flex; gap: 10px; }
.swatch {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  position: relative;
}
.swatch.selected { border-color: var(--ink); }
.swatch.selected::after {
  content: '';
  position: absolute; inset: -6px;
  border: 1px solid var(--ink);
  border-radius: 50%;
}

.size-options { display: flex; gap: 8px; flex-wrap: wrap; }
.size-btn {
  padding: 10px 16px;
  border: 1px solid var(--line);
  background: var(--card);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.85rem;
  border-radius: var(--radius);
}
.size-btn.selected { border-color: var(--ink); background: var(--ink); color: var(--white); }

.qty-row { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
.qty-control { display: flex; align-items: center; border: 1px solid var(--line); }
.qty-control button { background: none; border: none; width: 38px; height: 38px; cursor: pointer; font-size: 1.1rem; }
.qty-control span { width: 34px; text-align: center; font-weight: 700; }

.pd-actions { display: flex; gap: 12px; flex-wrap: wrap; }

.pd-meta { margin-top: 30px; font-size: 0.85rem; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 20px; }
.pd-meta p { margin: 4px 0; }

/* ============================================
   Cart & Checkout
   ============================================ */
.cart-layout, .checkout-layout {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 52px;
  padding: 60px 0 84px;
  align-items: start;
}
.checkout-layout { grid-template-columns: 1.3fr 1fr; }
@media (max-width: 860px) { .cart-layout, .checkout-layout { grid-template-columns: 1fr; } }

.cart-item {
  display: grid;
  grid-template-columns: 96px 1fr auto;
  gap: 18px;
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
  align-items: center;
}
.cart-item img { aspect-ratio: 4/5; object-fit: cover; }
.cart-item-name { font-family: var(--font-display); font-weight: 600; margin: 0 0 4px; }
.cart-item-meta { font-size: 0.85rem; color: var(--ink-soft); margin: 0 0 10px; }
.cart-item-remove { font-size: 0.8rem; color: var(--accent); cursor: pointer; border: none; background: none; padding: 0; font-weight: 600; }
.cart-item-price { font-weight: 700; text-align: end; white-space: nowrap; }

.summary-box { background: var(--sand); padding: 32px; border: 1px solid var(--line); }
.summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; }
.summary-row.total { font-weight: 800; font-size: 1.15rem; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; }

.empty-state { text-align: center; padding: 100px 24px; color: var(--ink-soft); }
.empty-state h2 { font-family: var(--font-display); color: var(--ink); margin-bottom: 10px; }

.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
input[type="text"], input[type="email"], input[type="tel"], select, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: var(--radius);
  color: var(--ink);
}
textarea { resize: vertical; min-height: 80px; }

.pay-note {
  background: var(--sand);
  border: 1px dashed var(--accent-soft);
  padding: 16px;
  font-size: 0.85rem;
  color: var(--ink-soft);
  margin-top: 8px;
  border-radius: var(--radius);
}

.order-success { text-align: center; padding: 100px 24px; }
.order-success h2 { font-family: var(--font-display); font-size: 1.8rem; margin-bottom: 12px; }
.order-success .num { color: var(--accent); font-weight: 800; }

/* ============================================
   Footer
   ============================================ */
.site-footer {
  border-top: 1px solid var(--line);
  padding: 56px 0 36px;
  margin-top: 40px;
}
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 32px; margin-bottom: 36px; }
@media (max-width: 700px) { .footer-grid { grid-template-columns: 1fr; } }
.footer-grid h4 {
  font-family: var(--font-nav);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin: 0 0 16px;
}
.footer-logo { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; }
.footer-grid ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 0.9rem; color: var(--ink-soft); }
.footer-bottom { font-size: 0.8rem; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 22px; letter-spacing: 0.03em; }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  inset-inline-start: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--white);
  padding: 13px 22px;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 0.85rem;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}
[dir="rtl"] .toast { transform: translateX(50%); }
.toast.show { opacity: 1; }

</style>
</head>

function getLang() {
  return localStorage.getItem("athar_lang") || "ar";
}

function setLang(lang) {
  localStorage.setItem("athar_lang", lang);
  applyLang();
}

function t(key) {
  const lang = getLang();
  return (I18N[lang] && I18N[lang][key]) || key;
}

function pName(p) { return p.name[getLang()]; }
function pDesc(p) { return p.desc[getLang()]; }

function applyLang(triggerOnLangChange = true) {
  const lang = getLang();
  const dict = I18N[lang];
  document.documentElement.lang = lang === "ar" ? "ar" : "en";
  document.documentElement.dir = dict.dir;

  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    if (dict[key]) el.textContent = dict[key];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
    const key = el.getAttribute("data-i18n-placeholder");
    if (dict[key]) el.setAttribute("placeholder", dict[key]);
  });

  const langBtn = document.getElementById("langBtn");
  if (langBtn) langBtn.textContent = dict.lang_switch;

  // Re-render any dynamic page content that depends on language
  if (triggerOnLangChange && typeof onLangChange === "function") onLangChange();
}

/* ---------- money ---------- */
function money(n) {
  const lang = getLang();
  const formatted = n.toLocaleString(lang === "ar" ? "ar-EG" : "en-US");
  return lang === "ar" ? `${formatted} ج.م` : `EGP ${formatted}`;
}

/* ---------- cart (localStorage) ----------
   cart item shape: { id, size, color, qty }
------------------------------------------- */
function getCart() {
  try {
    return JSON.parse(localStorage.getItem("athar_cart")) || [];
  } catch (e) {
    return [];
  }
}

function saveCart(cart) {
  localStorage.setItem("athar_cart", JSON.stringify(cart));
  updateCartCount();
}

function findProduct(id) {
  return PRODUCTS.find((p) => p.id === id);
}

function addToCart(id, size, color, qty) {
  const cart = getCart();
  const existing = cart.find((i) => i.id === id && i.size === size && i.color === color);
  if (existing) {
    existing.qty += qty;
  } else {
    cart.push({ id, size, color, qty });
  }
  saveCart(cart);
  showToast(t("added_to_cart"));
}

function removeFromCart(index) {
  const cart = getCart();
  cart.splice(index, 1);
  saveCart(cart);
}

function updateCartQty(index, qty) {
  const cart = getCart();
  if (!cart[index]) return;
  cart[index].qty = Math.max(1, qty);
  saveCart(cart);
}

function cartCount() {
  return getCart().reduce((sum, i) => sum + i.qty, 0);
}

function cartSubtotal() {
  return getCart().reduce((sum, i) => {
    const p = findProduct(i.id);
    return p ? sum + p.price * i.qty : sum;
  }, 0);
}

function cartTotal() {
  return cartSubtotal() + SHIPPING_FEE;
}

function updateCartCount() {
  const el = document.getElementById("cartCount");
  if (el) el.textContent = cartCount();
}

/* ---------- toast ---------- */
function showToast(msg) {
  let el = document.getElementById("toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

/* ---------- product card markup ---------- */
const CATEGORY_LABELS = {
  jewelry: { ar: "مجوهرات", en: "Jewelry" },
  leather: { ar: "جلديات وساعات", en: "Leather & Watches" },
  "gift-boxes": { ar: "علب هدايا", en: "Gift Boxes" },
};

function productCardHTML(p) {
  const priceHTML = p.compareAt
    ? `<span class="price-compare">${money(p.compareAt)}</span><span class="price-now">${money(p.price)}</span>`
    : money(p.price);
  const tagHTML = p.tag ? `<span class="product-tag">${p.tag[getLang()]}</span>` : "";
  const catLabel = CATEGORY_LABELS[p.category] ? CATEGORY_LABELS[p.category][getLang()] : "";
  const giftBadge = p.gifting ? `<div class="gift-badge">${t("gifting_badge")}</div>` : "";
  return `
    <a class="product-card" href="product.html?id=${p.id}">
      <div class="product-media">
        ${tagHTML}
        <img src="${p.image}" alt="${pName(p)}" loading="lazy">
      </div>
      <div class="product-cat">${catLabel}</div>
      <h3 class="product-name">${pName(p)}</h3>
      <div class="product-price">${priceHTML}</div>
      ${giftBadge}
    </a>
  `;
}

/* ---------- header wiring (nav toggle, lang, cart count) ---------- */
function wireHeader() {
  const langBtn = document.getElementById("langBtn");
  if (langBtn) {
    langBtn.addEventListener("click", () => setLang(getLang() === "ar" ? "en" : "ar"));
  }
  const navToggle = document.getElementById("navToggle");
  const mainNav = document.getElementById("mainNav");
  if (navToggle && mainNav) {
    navToggle.addEventListener("click", () => mainNav.classList.toggle("open"));
  }
  updateCartCount();
}

document.addEventListener("DOMContentLoaded", () => {
  wireHeader();
  applyLang();
});

<script>
  const productId = new URLSearchParams(location.search).get("id");
  const product = findProduct(productId) || PRODUCTS[0];
  let selectedColor = product.colors[0];
  let selectedSize = null;
  let qty = 1;

  function priceBlockHTML() {
    return product.compareAt
      ? `<span class="price-compare">${money(product.compareAt)}</span><span class="price-now">${money(product.price)}</span>`
      : money(product.price);
  }

  function renderDetail() {
    const root = document.getElementById("productDetailRoot");
    root.innerHTML = `
      <div class="product-detail">
        <div class="pd-media">
          <img src="${product.image}" alt="${pName(product)}">
        </div>
        <div class="pd-info">
          <div class="breadcrumb"><a href="shop.html" data-i18n="breadcrumb_shop">المتجر</a> / ${pName(product)}</div>
          <h1>${pName(product)}</h1>
          <div class="pd-price">${priceBlockHTML()}</div>
          <p class="pd-desc">${pDesc(product)}</p>

          <div class="option-group">
            <span class="option-label" data-i18n="color_label">اللون</span>
            <div class="swatches" id="swatches"></div>
          </div>

          <div class="option-group">
            <span class="option-label" data-i18n="size_label">المقاس</span>
            <div class="size-options" id="sizeOptions"></div>
          </div>

          <div class="qty-row">
            <span class="option-label" data-i18n="qty_label" style="margin-bottom:0">الكمية</span>
            <div class="qty-control">
              <button id="qtyMinus" type="button">−</button>
              <span id="qtyVal">1</span>
              <button id="qtyPlus" type="button">+</button>
            </div>
          </div>

          <div class="pd-actions">
            <button class="btn" id="addBtn" data-i18n="add_to_cart">أضف إلى السلة</button>
          </div>

          <div class="pd-meta">
            <p data-i18n="care_1">شحن خلال 2-4 أيام عمل داخل المحافظات.</p>
            <p data-i18n="care_2">إمكانية الاستبدال خلال 14 يوم من الاستلام.</p>
            <p data-i18n="care_3">الدفع عند الاستلام أو تحويل بنكي.</p>
          </div>
        </div>
      </div>
    `;
    applyLang(false);
    wireOptions();
  }

  function wireOptions() {
    const swatchWrap = document.getElementById("swatches");
    swatchWrap.innerHTML = product.colors.map((c, i) => `
      <button type="button" class="swatch ${c === selectedColor ? 'selected' : ''}" style="background:${c}" data-color="${c}" aria-label="color"></button>
    `).join("");
    swatchWrap.querySelectorAll(".swatch").forEach((sw) => {
      sw.addEventListener("click", () => {
        selectedColor = sw.dataset.color;
        swatchWrap.querySelectorAll(".swatch").forEach((s) => s.classList.remove("selected"));
        sw.classList.add("selected");
      });
    });

    const sizeWrap = document.getElementById("sizeOptions");
    sizeWrap.innerHTML = product.sizes.map((s) => `
      <button type="button" class="size-btn" data-size="${s}">${s}</button>
    `).join("");
    if (product.sizes.length === 1) {
      selectedSize = product.sizes[0];
    }
    sizeWrap.querySelectorAll(".size-btn").forEach((btn) => {
      if (btn.dataset.size === selectedSize) btn.classList.add("selected");
      btn.addEventListener("click", () => {
        selectedSize = btn.dataset.size;
        sizeWrap.querySelectorAll(".size-btn").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });

    document.getElementById("qtyMinus").addEventListener("click", () => {
      qty = Math.max(1, qty - 1);
      document.getElementById("qtyVal").textContent = qty;
    });
    document.getElementById("qtyPlus").addEventListener("click", () => {
      qty += 1;
      document.getElementById("qtyVal").textContent = qty;
    });

    document.getElementById("addBtn").addEventListener("click", () => {
      if (!selectedSize) {
        showToast(t("select_size"));
        return;
      }
      addToCart(product.id, selectedSize, selectedColor, qty);
    });
  }

  function onLangChange() { renderDetail(); }
  renderDetail();
</script>
